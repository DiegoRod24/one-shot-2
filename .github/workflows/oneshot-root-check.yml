name: ONE SHOT stability check

on:
  push:
    branches: [main, 'agent/oneshot-*']
  pull_request:

jobs:
  stability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check app.js
          node --check one-bootstrap-v643.js
          node --check one-v646-core.js
          node --check one-v646-reports.js
          node --check one-v647-core.js
          node --check one-v648-guided.js
          node --check one-v649-fer-session.js
          node --check one-v6411-municipal.js
          node --check one-v6411-orientation.js
          node --check one-v6411-reports.js
          node --check one-v6412-fer-visual.js
          node --check one-v6412-fer-voice.js
          node --check one-v6412-party-logos.js
          node --check one-v6412-guided-ux.js
          node --check one-v6413-corridor.js
          node --check one-v6413-corridor-reports.js
          node --check one-v6414-health-runtime.js
          node --check one-v6415-territory-ops.js
          node --check oneshot-erm-data.js
          node --check APK/scripts/prepare-webdir.js
          node --check APK/scripts/oneshot-health-check.js
          node --check service-worker.js
      - name: Repository health audit
        run: node APK/scripts/oneshot-health-check.js
      - name: Android WebDir dry run
        run: |
          node APK/scripts/prepare-webdir.js
          test -f www/one-v6415-territory-ops.js
          test -f www/one-v6414-health-runtime.js
          test -f www/one-v6413-corridor.js
          test -f www/one-v6412-fer-voice.js
          test -f www/municipal-data-v630-01.js
          test -f www/party-catalog-v6410.js
      - name: Business and UX guards
        run: |
          grep -q "new Set(\['PANEL','BANNER','PINTA'\])" one-v646-core.js
          grep -q "captureAddress" one-v646-core.js
          grep -q "municipalAddress" one-v646-core.js
          grep -q "MISSING_DISTRICT" one-v6411-municipal.js
          grep -q "municipalConfirmed=true" one-v6411-municipal.js
          ! grep -q 'fer-v641.js' service-worker.js
          grep -q "getVoices" one-v6412-fer-voice.js
          grep -q "v6412LogoFallback" one-v6412-party-logos.js
          grep -q "Tramo de propaganda repetitiva" one-v6413-corridor.js
          grep -q "TRAMOS_PROPAGANDA" one-v6413-corridor-reports.js
          ! grep -q "indexedDB.deleteDatabase" one-v646-core.js one-v647-core.js one-v6411-municipal.js one-v6413-corridor.js one-v6414-health-runtime.js one-v6415-territory-ops.js
      - name: Territory operations guards
        run: |
          grep -q "team-assignment-package" one-v6415-territory-ops.js
          grep -q "navigator.share" one-v6415-territory-ops.js
          grep -q "sectorStats" one-v6415-territory-ops.js
          grep -q "evidence:2" one-v6415-territory-ops.js
          grep -q "team-pause" one-v6415-territory-ops.js
          grep -q "No hay zonas pendientes válidas" one-v6415-territory-ops.js
          grep -q "Mi ubicación" one-v6415-territory-ops.js
          grep -q "6.4.15 TERRITORIO OPERATIVO" one-v6415-territory-ops.js
      - name: Legacy runtime removal guards
        run: |
          ! grep -q 'oneshot-v6.0.5-one-focus-session' oneshot-erm-data.js
          ! grep -q 'ONE FOCUS SESSION' oneshot-erm-data.js
          grep -q 'runtime-recovery' oneshot-erm-data.js
          grep -q "assistantName='Fer'" one-v6414-health-runtime.js
      - name: Version and updater guards
        run: |
          grep -q 'oneshot-v6.4.15-territory-ops-01' version.json
          grep -q 'oneshot-v6.4.15-territory-ops-01' one-bootstrap-v643.js
          grep -q 'oneshot-v6.4.15-territory-ops-01' service-worker.js
          grep -q 'ONE_V6415_TERRITORY_OPS' one-bootstrap-v643.js
          grep -q 'one-v6415-territory-ops.js' service-worker.js
          grep -q 'DiegoRod24/one-shot-2/main/version.json' one-bootstrap-v643.js
          grep -q '"version": "6.4.15"' package.json
