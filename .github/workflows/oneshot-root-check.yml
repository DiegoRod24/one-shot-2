name: ONE SHOT stability check

on:
  push:
    branches: [main, 'agent/oneshot-*']
  pull_request:

jobs:
  stability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check app.js
          node --check one-bootstrap-v643.js
          node --check one-v646-core.js
          node --check one-v646-reports.js
          node --check one-v647-core.js
          node --check one-v648-guided.js
          node --check one-v649-fer-session.js
          node --check one-v6411-municipal.js
          node --check one-v6411-orientation.js
          node --check one-v6411-reports.js
          node --check one-v6412-fer-visual.js
          node --check one-v6412-fer-voice.js
          node --check one-v6412-party-logos.js
          node --check one-v6412-guided-ux.js
          node --check one-v6413-corridor.js
          node --check one-v6413-corridor-reports.js
          node --check one-v6414-health-runtime.js
          node --check one-v6415-territory-ops.js
          node --check one-v6416-edit-flow.js
          node --check one-v6416-evidence-recovery.js
          node --check one-v6416-media-legacy-bridge.js
          node --check one-v6416-runtime-meta.js
          node --check one-v6417-panel-provider.js
          node --check oneshot-erm-data.js
          node --check APK/scripts/prepare-webdir.js
          node --check APK/scripts/oneshot-health-check.js
          node --check service-worker.js
      - name: Repository health audit
        run: node APK/scripts/oneshot-health-check.js
      - name: Android WebDir dry run
        run: |
          node APK/scripts/prepare-webdir.js
          test -f www/one-v6417-panel-provider.js
          test -f www/one-v6416-edit-flow.js
          test -f www/one-v6416-evidence-recovery.js
          test -f www/one-v6416-media-legacy-bridge.js
          test -f www/one-v6416-runtime-meta.js
          test -f www/one-v6415-territory-ops.js
          test -f www/one-v6414-health-runtime.js
          test -f www/one-v6413-corridor.js
          test -f www/one-v6412-fer-voice.js
          test -f www/municipal-data-v630-01.js
          test -f www/party-catalog-v6410.js
      - name: Business and UX guards
        run: |
          grep -q "new Set(\['PANEL','BANNER','PINTA'\])" one-v646-core.js
          grep -q "captureAddress" one-v646-core.js
          grep -q "municipalAddress" one-v646-core.js
          grep -q "MISSING_DISTRICT" one-v6411-municipal.js
          grep -q "municipalConfirmed=true" one-v6411-municipal.js
          ! grep -q 'fer-v641.js' service-worker.js
          grep -q "getVoices" one-v6412-fer-voice.js
          grep -q "v6412LogoFallback" one-v6412-party-logos.js
          grep -q "Tramo de propaganda repetitiva" one-v6413-corridor.js
          grep -q "TRAMOS_PROPAGANDA" one-v6413-corridor-reports.js
          ! grep -q "indexedDB.deleteDatabase" one-v646-core.js one-v647-core.js one-v6411-municipal.js one-v6413-corridor.js one-v6414-health-runtime.js one-v6415-territory-ops.js one-v6416-edit-flow.js one-v6416-evidence-recovery.js one-v6416-media-legacy-bridge.js one-v6416-runtime-meta.js one-v6417-panel-provider.js
      - name: Territory operations guards
        run: |
          grep -q "team-assignment-package" one-v6415-territory-ops.js
          grep -q "navigator.share" one-v6415-territory-ops.js
          grep -q "sectorStats" one-v6415-territory-ops.js
          grep -q "evidence:2" one-v6415-territory-ops.js
          grep -q "team-pause" one-v6415-territory-ops.js
          grep -q "No hay zonas pendientes válidas" one-v6415-territory-ops.js
          grep -q "Mi ubicación" one-v6415-territory-ops.js
          grep -q "6.4.15 TERRITORIO OPERATIVO" one-v6415-territory-ops.js
      - name: Edit flow and evidence recovery guards
        run: |
          grep -q "GuidedEditor.choose=choose" one-v6416-edit-flow.js
          grep -q "await persistStep(next)" one-v6416-edit-flow.js
          grep -q "No se pudo confirmar el guardado de este paso" one-v6416-edit-flow.js
          grep -q "Dejar pendiente" one-v6416-edit-flow.js
          grep -q "ferSpriteV6412" one-v6416-edit-flow.js
          grep -q "delete host.dataset.v6412FerMounted" one-v6416-edit-flow.js
          grep -q "new Set(\['PANEL','BANNER','PINTA'\])" one-v6416-edit-flow.js
          grep -q "durablePut" one-v6416-evidence-recovery.js
          grep -q "const saved=await dbGet(record.id)" one-v6416-evidence-recovery.js
          grep -q "ONE_SHOT_RECUPERACION_" one-v6416-evidence-recovery.js
          grep -q "Fotos anteriores" one-v6416-evidence-recovery.js
          grep -q "imageOriginal" one-v6416-evidence-recovery.js
          grep -q "photoData" one-v6416-evidence-recovery.js
          grep -q "navigator.storage" one-v6416-evidence-recovery.js
          grep -q "bridge(record,'image'" one-v6416-media-legacy-bridge.js
          grep -q "Object.defineProperty(record,key" one-v6416-media-legacy-bridge.js
          grep -q "enumerable:false" one-v6416-media-legacy-bridge.js
          grep -q "storageSchema='oneshotEvidenceDB_v2'" one-v6416-runtime-meta.js
          grep -q 'indexedDB.open("oneshotEvidenceDB_v2"' app.js
      - name: Panel provider guards
        run: |
          grep -q "const PROVIDERS=\[" one-v6417-panel-provider.js
          test "$(grep -c '^\[' one-v6417-panel-provider.js)" -eq 42
          grep -q "NO SE VISUALIZA EMPRESA" one-v6417-panel-provider.js
          grep -q "if(v==='PANEL')" one-v6417-panel-provider.js
          grep -q "Paso 3 de 4 · Proveedor del panel" one-v6417-panel-provider.js
          grep -q "panelProvider=v;r.provider=v;r.company=v;r.empresa=v" one-v6417-panel-provider.js
          grep -q "No se pudo confirmar el proveedor en almacenamiento" one-v6417-panel-provider.js
          grep -q "JCDECAUX" one-v6417-panel-provider.js
          grep -q "CITYMEDIA" one-v6417-panel-provider.js
          grep -q "LEDEX" one-v6417-panel-provider.js
          grep -q "one-v6417-panel-provider.js" service-worker.js
      - name: Legacy runtime removal guards
        run: |
          ! grep -q 'oneshot-v6.0.5-one-focus-session' oneshot-erm-data.js
          ! grep -q 'ONE FOCUS SESSION' oneshot-erm-data.js
          grep -q 'runtime-recovery' oneshot-erm-data.js
          grep -q "assistantName='Fer'" one-v6414-health-runtime.js
      - name: Version and updater guards
        run: |
          grep -q 'oneshot-v6.4.17-panel-provider-flow-01' version.json
          grep -q 'oneshot-v6.4.17-panel-provider-flow-01' one-bootstrap-v643.js
          grep -q 'oneshot-v6.4.17-panel-provider-flow-01' service-worker.js
          grep -q 'ONE_V6417_PANEL_PROVIDER' one-bootstrap-v643.js
          grep -q 'one-v6417-panel-provider.js' service-worker.js
          grep -q 'DiegoRod24/one-shot-2/main/version.json' one-bootstrap-v643.js
          grep -q '"version": "6.4.17"' package.json
