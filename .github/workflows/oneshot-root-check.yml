name: ONE SHOT stability check

on:
  push:
    branches:
      - main
      - 'agent/oneshot-*'
    paths:
      - 'app.js'
      - 'one-bootstrap-v643.js'
      - 'one-v63-core.js'
      - 'one-v643-core.js'
      - 'one-v644-core.js'
      - 'one-v645-core.js'
      - 'one-v646-*.js'
      - 'one-v647-*.js'
      - 'one-v648-*.js'
      - 'one-v649-*.js'
      - 'party-catalog-v631.js'
      - 'party-logos-v631.webp'
      - 'service-worker.js'
      - 'version.json'
      - '.github/workflows/oneshot-root-check.yml'
  pull_request:
    paths:
      - 'app.js'
      - 'one-bootstrap-v643.js'
      - 'one-v63-core.js'
      - 'one-v643-core.js'
      - 'one-v644-core.js'
      - 'one-v645-core.js'
      - 'one-v646-*.js'
      - 'one-v647-*.js'
      - 'one-v648-*.js'
      - 'one-v649-*.js'
      - 'party-catalog-v631.js'
      - 'party-logos-v631.webp'
      - 'service-worker.js'
      - 'version.json'

jobs:
  stability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check app.js
          node --check one-bootstrap-v643.js
          node --check one-v63-core.js
          node --check one-v643-core.js
          node --check one-v644-core.js
          node --check one-v645-core.js
          node --check one-v646-core.js
          node --check one-v646-fer.js
          node --check one-v646-evidence.js
          node --check one-v646-map.js
          node --check one-v646-reports.js
          node --check one-v647-core.js
          node --check one-v647-fer.js
          node --check one-v647-logos.js
          node --check one-v648-guided.js
          node --check one-v648-logo-source.js
          node --check one-v649-fer-session.js
          node --check one-v649-logos.js
          node --check service-worker.js
      - name: Business rules
        run: |
          grep -q "new Set(\['PANEL','BANNER','PINTA'\])" one-v646-core.js
          grep -q "captureAddress" one-v646-core.js
          grep -q "municipalAddress" one-v646-core.js
          grep -q "DEPARTAMENTO + PROVINCIA + DISTRITO" one-v646-core.js
          grep -q "PURE_NUMBER" one-v647-core.js
          grep -q "SEMANTIC_FIELDS_REJECT_BARE_NUMERIC_OR_UI_COMMAND" one-v647-core.js
          grep -q "SAVE-NEXT" one-v647-core.js
          grep -q "patchReverse" one-v647-core.js
          ! grep -q "indexedDB.deleteDatabase" one-v646-core.js one-v646-reports.js one-v647-core.js one-v647-fer.js one-v647-logos.js one-v648-guided.js one-v648-logo-source.js one-v649-fer-session.js one-v649-logos.js
      - name: Guided party flow guards
        run: |
          grep -q "{key:'party'" one-v648-guided.js
          grep -q "{key:'type'" one-v648-guided.js
          grep -q "{key:'summary'" one-v648-guided.js
          grep -q "GuidedEditor.current=current" one-v648-guided.js
          grep -q "GuidedEditor.render=render" one-v648-guided.js
          grep -q "previous!=='6.4.8'" one-v648-guided.js
          grep -q "v648PartyLogo" one-v648-guided.js
          grep -q "party-logos-v631.webp" one-v648-logo-source.js
          node - <<'NODE'
          global.window=global;
          require('./party-catalog-v631.js');
          const a=global.ONE_PARTY_CATALOG_V631||[];
          const names=a.map(x=>String(x.name||'').trim().toUpperCase());
          if(a.length!==74) throw new Error(`party catalog must have 74 unique options, got ${a.length}`);
          if(new Set(names).size!==74) throw new Error('party catalog contains duplicates');
          if(!names.includes('PARTIDO DEMOCRATICO SOMOS PERU')) throw new Error('Somos Peru missing');
          NODE
      - name: Fer voice lifecycle guards
        run: |
          grep -q "speechSynthesis.speaking" one-v649-fer-session.js
          grep -q "S.cancelRecognition" one-v649-fer-session.js
          grep -q "S.cancelSpeech" one-v649-fer-session.js
          grep -q "Editor.close=(...a)=>{S.stopAll()" one-v649-fer-session.js
          grep -q "editClose.*S.stopAll" one-v649-fer-session.js
          grep -q "GuidedEditor.toggleListening=()=>S.toggle()" one-v649-fer-session.js
          grep -q "GuidedEditor.say=text=>S.speak(text)" one-v649-fer-session.js
          grep -q "r.abort" one-v649-fer-session.js
          grep -q "Cuando termine de hablar, te escucharé automáticamente" one-v649-fer-session.js
      - name: Excel guards
        run: |
          grep -q "addImage" one-v646-reports.js
          grep -q "SEGUIMIENTO_ENTREGAS" one-v646-reports.js
          grep -q "DATOS_TECNICOS" one-v646-reports.js
          grep -q "Dirección.*municipalidad destinataria" one-v646-reports.js
          grep -q "Reports.__v647Semantic" one-v647-core.js
          grep -q "sanitizeRecord" one-v647-core.js
          ! grep -q "window.candidato" one-v645-core.js one-v646-reports.js one-v647-core.js
          ! grep -q "candidate:r.candidate" one-v646-reports.js
      - name: Fer and logo guards
        run: |
          test "$(grep -o 'fer-v640.js' service-worker.js | wc -l)" -eq 1
          ! grep -q 'fer-v641.js' service-worker.js
          grep -q 'width:76px!important;height:84px!important' one-v647-fer.js
          grep -q 'scale:1.13' one-v647-fer.js
          grep -q "party-logos-v631.webp?v=6491" one-v649-logos.js
          grep -q "backgroundSize='640px 512px'" one-v649-logos.js
          grep -q "c\*64" one-v649-logos.js
          grep -q "paintFallback" one-v649-logos.js
          grep -q 'Ninguna' one-v646-evidence.js
      - name: Version and updater guards
        run: |
          grep -q 'oneshot-v6.4.9-fer-session-logos-real-fix-01' version.json
          grep -q 'oneshot-v6.4.9-fer-session-logos-real-fix-01' one-bootstrap-v643.js
          grep -q 'ONE_V649_FER_SESSION' one-bootstrap-v643.js
          grep -q 'ONE_V649_LOGOS' one-bootstrap-v643.js
          grep -q 'DiegoRod24/one-shot-2/main/version.json' one-bootstrap-v643.js
          grep -q 'oneshotDismissedBuild' one-bootstrap-v643.js
          ! grep -q "removeItem('oneshotDismissedBuild')" one-bootstrap-v643.js
          grep -q 'one-v649-fer-session.js' service-worker.js
          grep -q 'one-v649-logos.js' service-worker.js
