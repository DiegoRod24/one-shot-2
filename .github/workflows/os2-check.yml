name: OS2 check

on:
  push:
    branches:
      - main
      - 'agent/os2-*'
    paths:
      - 'v2/**'
      - '.github/workflows/os2-check.yml'
  pull_request:
    paths:
      - 'v2/**'
      - '.github/workflows/os2-check.yml'

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check v2/core.js
          node --check v2/field.js
          node --check v2/evidence.js
          node --check v2/fer.js
          node --check v2/reports.js
          node --check v2/app.js
          node --check v2/service-worker.js
      - name: Check required OS2 files
        run: |
          test -f v2/index.html
          test -f v2/styles.css
          test -f v2/manifest.json
          test -f v2/version.json
          test -f v2/os2-logo.svg
          grep -q "PINTA" v2/core.js
          grep -q "SEGUIMIENTO_ENTREGAS" v2/reports.js
